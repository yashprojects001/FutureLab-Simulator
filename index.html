<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>FutureLab Simulator</title><style>html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at top,#f6f0d0,#bda96a 25%,#171717 75%,#000);font-family:Inter,Arial,sans-serif;color:#fff}canvas{position:absolute;inset:0}.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);border-radius:24px;box-shadow:0 0 40px rgba(255,215,140,.15)}#ui{position:absolute;inset:18px;display:grid;grid-template-columns:320px 1fr 340px;gap:18px;pointer-events:none}.panel{padding:18px;pointer-events:auto}.title{font-size:30px;font-weight:900;background:linear-gradient(90deg,#fff,#ffe8a3,#ffd06a);-webkit-background-clip:text;color:transparent}.btn{width:100%;padding:12px;margin-top:10px;border:0;border-radius:14px;background:linear-gradient(90deg,#fff1b8,#d8b45a);font-weight:800;color:#111;cursor:pointer}.module{position:absolute;width:180px;padding:14px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);cursor:grab;user-select:none}.chip{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);margin:4px;font-size:12px}</style></head><body><canvas id='bg'></canvas><div id='modules'></div><div id='ui'><div class='glass panel'><div class='title'>FutureLab</div><p>Sleek scientific future simulation engine.</p><button class='btn' onclick='spawn()'>Add Innovation Module</button><button class='btn' onclick='simulate()'>Run Simulation</button><button class='btn' onclick='generate()'>Generate Breakthrough</button><div><span class='chip'>Medicine</span><span class='chip'>Robotics</span><span class='chip'>AI</span><span class='chip'>Biotech</span></div></div><div></div><div class='glass panel'><h3>Simulation Core</h3><div id='log'>System ready.</div></div></div><script>const c=document.getElementById('bg'),x=c.getContext('2d');function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener('resize',rs);let mouse={x:innerWidth/2,y:innerHeight/2};addEventListener('mousemove',e=>mouse={x:e.clientX,y:e.clientY});const stars=[...Array(800)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,z:Math.random()*1000,v:Math.random()*2+.2}));const city=[...Array(80)].map((_,i)=>({x:i*30,h:80+Math.random()*260}));let t=0;function draw(){x.clearRect(0,0,c.width,c.height);t+=.01;for(const s of stars){s.z-=s.v;if(s.z<1)s.z=1000;const k=500/s.z,px=(s.x-innerWidth/2)*k+innerWidth/2,py=(s.y-innerHeight/2)*k+innerHeight/2,r=Math.max(.2,2*k);x.beginPath();x.arc(px,py,r,0,7);x.fillStyle='rgba(255,245,200,.9)';x.fill()}const g=x.createRadialGradient(innerWidth/2,innerHeight/2,20,innerWidth/2,innerHeight/2,180);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.3,'rgba(255,215,120,.45)');g.addColorStop(1,'rgba(255,215,120,0)');x.fillStyle=g;x.beginPath();x.arc(innerWidth/2,innerHeight/2,180+Math.sin(t*2)*12,0,7);x.fill();x.fillStyle='rgba(255,230,170,.15)';for(const b of city)x.fillRect(b.x,innerHeight-b.h,b.x+22,b.h);requestAnimationFrame(draw)}draw();const mods=document.getElementById('modules');let arr=[];function drag(el){let d=0,ox=0,oy=0;el.onmousedown=e=>{d=1;ox=e.offsetX;oy=e.offsetY};addEventListener('mouseup',()=>d=0);addEventListener('mousemove',e=>{if(!d)return;el.style.left=e.clientX-ox+'px';el.style.top=e.clientY-oy+'px'})}function spawn(txt){const ideas=['Nano Surgery Cloud','Synthetic Organ Mesh','Autonomous Lab Swarm','Quantum Neural Prosthetic','Bio-AI Healing Grid','Adaptive Robotics Tissue'];const d=document.createElement('div');d.className='module';d.style.left=Math.random()*(innerWidth-220)+'px';d.style.top=Math.random()*(innerHeight-140)+'px';d.innerHTML='<b>'+(txt||ideas[Math.floor(Math.random()*ideas.length)])+'</b><div style="margin-top:8px;opacity:.8">Future technology module</div>';mods.appendChild(d);drag(d);arr.push(d)}for(let i=0;i<8;i++)spawn();function log(v){document.getElementById('log').innerHTML=v}function simulate(){log('Running multi-domain future simulation… societal impact + risk + adoption + economics');pulse()}function generate(){const combos=['AI+Biotech = Neural Tissue Printer','Medicine+Robotics = Autonomous Surgery Hive','AI+Medicine = Predictive Cellular Repair'];const c=combos[Math.floor(Math.random()*combos.length)];spawn(c);log('Breakthrough: '+c)}function pulse(){document.body.animate([{filter:'brightness(1)'},{filter:'brightness(1.2)'},{filter:'brightness(1)'}],{duration:900})}</script></body></html>
